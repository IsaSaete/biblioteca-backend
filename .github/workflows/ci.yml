name: CI

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test and build

    steps:
      - name: ⬇ Git checkout
        uses: actions/checkout@v4

      - name: ❓ Check if .editorconfig exists
        uses: andstor/file-existence-action@v3
        with:
          files: ".editorconfig"
          fail: true

      - name: 🙈 Ensure node_modules is ignored by Git
        uses: dkershner6/gitignore-parser@v2
        with:
          must_deny: "node_modules"

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 💾 Install modules
        run: npm ci

      - name: 🍃 Cache MongoDB binary for in-memory tests
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-${{ runner.os }}-6.0.14

      - name: 🔍 Lint
        run: npm run lint

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Test
        run: npm run test
        env:
          NODE_ENV: test
          PORT: "4000"
          MONGODB_URI: "mongodb://127.0.0.1:27017/test"
          FRONTEND_URL: "http://localhost:5173"
          ACCESS_TOKEN_SECRET: "test-access-token-secret-0123456789"
          REFRESH_TOKEN_SECRET: "test-refresh-token-secret-0123456789"
          RESEND: "test-resend-key"
          GOOGLE_BOOKS_API_KEY: "test-google-books-key"

      - name: 🏗️ Build
        run: npm run build
